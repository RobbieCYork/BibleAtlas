<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Unsubscribe | Capstone Bible</title>
    <style>
      :root { --bg: #ffffff; --text: #1a1a1a; --muted: #4b5563; --border: #d1d5db; --accent: #1d4ed8; --accent-text: #ffffff; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #111827; --text: #f3f4f6; --muted: #cbd5e1; --border: #374151; --accent: #93c5fd; --accent-text: #111827; }
      }
      html, body { margin: 0; background: var(--bg); color: var(--text); }
      body { font: 16px/1.5 Georgia, "Times New Roman", serif; }
      main { max-width: 560px; margin: 0 auto; padding: 32px 16px; box-sizing: border-box; }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { margin: 0 0 14px; }
      .muted { color: var(--muted); font-size: 14px; }
      button { font: 600 16px/1.2 Arial, Helvetica, sans-serif; padding: 12px 16px; border-radius: 6px; cursor: pointer; width: 100%; margin: 0 0 10px; }
      .primary { background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); }
      .secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
      button:disabled { opacity: 0.6; cursor: default; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Unsubscribe</h1>
      <div id="choose">
        <p>Stop Capstone Bible invitation emails to this address.</p>
        <button type="button" class="primary" id="all">Stop all invitations to this address</button>
        <button type="button" class="secondary" id="class">Only stop reminders for this one class or group</button>
        <p class="muted">"Stop all" means no teacher or leader can invite this address through Capstone Bible again.</p>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="muted">Capstone Bible &middot; <a href="/" style="color: inherit">capstonebible.com</a></p>
    </main>
    <script type="module" src="/src/email/unsubscribe.ts"></script>
  </body>
</html>
