<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <!-- "Illuminated" type system — three roles, never mixed (see src/index.css):
         Cormorant Garamond = display/headings, EB Garamond = Scripture & long-form prose,
         Archivo = UI chrome. One combined request so it's a single round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Capstone Bible" />
    <!-- Page-level pinch-zoom disabled: on iOS it visually detaches the fixed bottom tab bar from
         the rest of the layout mid-zoom (a native viewport quirk, not something CSS can prevent).
         Map (MapLibre) and Timeline each implement their own independent pinch/wheel zoom directly on
         their own canvas, so this doesn't affect either of those. Text size has its own dedicated
         accessibility control in Settings (the A-/A+ toggle) as the alternative to page pinch-zoom. -->
    <!-- interactive-widget=resizes-visual: when the on-screen keyboard opens it must NOT resize the
         layout viewport. The app shell is a fixed-height flex column with the bottom tab bar as its
         last child, so a layout-viewport shrink would drag the tab bar up on top of the keyboard and
         (combined with the browser's own scroll-into-view) push the focused field off the top of the
         screen. Keeping the layout viewport at its full size lets the tab bar stay anchored to the
         bottom of the page, behind the keyboard, while only the visual viewport scrolls to reveal the
         field. This is the default on iOS Safari; declaring it explicitly pins the same behavior on
         Chrome/Android, and src/lib/viewportHeight.ts enforces the matching rule for --app-height. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual" />
    <title>Capstone Bible</title>
    <!-- Last-resort recovery for a build's own assets 404ing.
         Vite content-hashes everything under /assets/, and a Vercel deploy only serves the
         hashed files belonging to the deployment currently promoted. So when this HTML is
         served from an edge cache that outlived the deploy it came from, the bundle and
         stylesheet it names no longer exist and both 404: the app either renders with no
         styles at all, or — because there is no code splitting, so main.tsx *is* the whole
         bundle — never boots and shows a blank page. In that second case nothing in src/
         gets the chance to run, which is why this lives inline in the HTML and not in
         lib/updateCheck.ts.
         A reload is the correct response, because the stale HTML is what has to be
         replaced and re-requesting the document is the only way to replace it. It cannot
         be a *single* reload, though. Measured against the live edge on 2026-09-06: a
         deployment was promoted at 06:50:49 UTC and eight seconds later capstonebible.com
         still answered GET / with x-vercel-cache: HIT, age=41 — the previous deployment's
         HTML, naming a stylesheet that had already been withdrawn and now 404'd. Fresh
         HTML did not appear on that edge node until 06:51:01. So the window is real and
         runs about 10-15 seconds, and a reload fired immediately lands inside it and comes
         back just as broken.
         Hence a short bounded backoff: reload after 2s, then 6s, then 15s, then stop. The
         attempts span ~23s, which clears the measured window with margin. DELAYS.length is
         the cap and the cap is the point — if the edge is still handing out the same stale
         HTML after three tries, a fourth is a reload loop, which is strictly worse than
         standing still. At that point we stop and say so in plain inline-styled text,
         because the stylesheet is precisely the thing that may be missing.
         The attempt count lives in sessionStorage and is written *before* each reload, so
         it survives the reload it schedules — a counter that reset on reload would make
         "three attempts" mean "forever". It is cleared again on any page load that fetched
         all of its own assets, so the next deploy gets the full budget.
         Note this cannot be fixed with cache headers. /, /index.html and /version.json all
         carry Vercel-CDN-Cache-Control: no-store (see vercel.json) and Vercel's edge caches
         them regardless: age was measured climbing 211 -> 233 with that header in force.
         Vercel does not allow bypassing the cache for static files, so recovering on the
         client is the remaining option.
         Registered with capture: true because resource-load errors fire on the element and
         do not bubble; placed above Vite's injected <script>/<link> so the listener exists
         before either is parsed. -->
    <script>
      (function () {
        var KEY = 'cb:asset-recovery';
        var DELAYS = [2000, 6000, 15000];
        /* The js and the css can both 404 on the same load; only act on the first. */
        var handled = false;
        var sawError = false;

        function attempts() {
          try {
            return Number(window.sessionStorage.getItem(KEY)) || 0;
          } catch (e) {
            /* Storage blocked (private mode, cookies off). With nowhere to record the
               attempt there is no way to bound the retries, so we must not start. */
            return null;
          }
        }

        function record(n) {
          try {
            window.sessionStorage.setItem(KEY, String(n));
            return true;
          } catch (e) {
            return false;
          }
        }

        function explain() {
          var el = document.createElement('div');
          el.setAttribute(
            'style',
            'position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;' +
              'justify-content:center;padding:24px;background:#ffffff;color:#111111;' +
              'font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;text-align:center;' +
              'z-index:2147483647'
          );
          el.textContent = 'Capstone Bible is updating. Please reload the page in a moment.';
          if (document.body) document.body.appendChild(el);
          else window.addEventListener('DOMContentLoaded', function () { document.body.appendChild(el); });
        }

        window.addEventListener(
          'error',
          function (event) {
            var el = event.target;
            if (!el || !el.tagName) return;
            var url = el.src || el.href;
            if (!url || url.indexOf('/assets/') === -1) return;

            sawError = true;
            if (handled) return;
            handled = true;

            var n = attempts();
            if (n === null || n >= DELAYS.length || !record(n + 1)) {
              explain();
              return;
            }
            window.setTimeout(function () {
              window.location.reload();
            }, DELAYS[n]);
          },
          true
        );

        /* Every asset this document named came back. Forget the attempts. */
        window.addEventListener('load', function () {
          if (sawError) return;
          try {
            window.sessionStorage.removeItem(KEY);
          } catch (e) {}
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
