<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Capstone Bible" />
    <!-- Page-level pinch-zoom disabled: on iOS it visually detaches the fixed bottom tab bar from
         the rest of the layout mid-zoom (a native viewport quirk, not something CSS can prevent).
         Map (MapLibre) and Timeline each implement their own independent pinch/wheel zoom directly on
         their own canvas, so this doesn't affect either of those. Text size has its own dedicated
         accessibility control in Settings (the A-/A+ toggle) as the alternative to page pinch-zoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Capstone Bible</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
